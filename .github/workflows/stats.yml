name: Generate stats cards

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVG cards
        run: node .github/scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push
        run: |
          git config user.name "keybodhi"
          git config user.email "keybodhi@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats cards"
          git push
